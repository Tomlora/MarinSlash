name: Tests slash lol_morts

on:
  push:
    paths:
      - "cogs/lol_morts.py"
      - "tests/test_lol_morts.py"
      - ".github/workflows/test-lol-morts.yml"
  pull_request:
    paths:
      - "cogs/lol_morts.py"
      - "tests/test_lol_morts.py"
      - ".github/workflows/test-lol-morts.yml"

jobs:
  offline-deaths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pandas discord-py-interactions==5.13.2
      - run: python -m pytest -q tests/test_lol_morts.py
