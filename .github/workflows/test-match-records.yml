name: Tests MatchLoL records

on:
  push:
    paths:
      - "cogs/lol_records.py"
      - "cogs/leagueoflegends.py"
      - "fonctions/challenge_ui.py"
      - "cogs/settings_records.py"
      - "cogs/lol_match_views.py"
      - "fonctions/match/records_preferences.py"
      - "fonctions/match/match_views.py"
      - "fonctions/match/recap_details.py"
      - "fonctions/match/save_data.py"
      - "scripts/create_match_recap_details.sql"
      - "tests/test_match_records_database.py"
      - "scripts/create_records_preferences.sql"
      - "fonctions/match/records_ui.py"
      - "fonctions/match/records_display.py"
      - "tests/test_match_records_ui.py"
      - "tests/test_match_records_interactions.py"
      - ".github/workflows/test-match-records.yml"
  pull_request:
    paths:
      - "cogs/lol_records.py"
      - "cogs/leagueoflegends.py"
      - "fonctions/challenge_ui.py"
      - "cogs/settings_records.py"
      - "cogs/lol_match_views.py"
      - "fonctions/match/records_preferences.py"
      - "fonctions/match/match_views.py"
      - "fonctions/match/recap_details.py"
      - "fonctions/match/save_data.py"
      - "scripts/create_match_recap_details.sql"
      - "tests/test_match_records_database.py"
      - "scripts/create_records_preferences.sql"
      - "fonctions/match/records_ui.py"
      - "fonctions/match/records_display.py"
      - "tests/test_match_records_ui.py"
      - "tests/test_match_records_interactions.py"
      - ".github/workflows/test-match-records.yml"

jobs:
  offline-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: records_test
          POSTGRES_USER: records_test
          POSTGRES_PASSWORD: records_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U records_test -d records_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://records_test:records_test@localhost:5432/records_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pandas Pillow matplotlib discord-py-interactions==5.13.2 'psycopg[binary]'
      - name: Compile changed MatchLoL modules
        run: python -m py_compile cogs/leagueoflegends.py cogs/lol_records.py cogs/settings_records.py cogs/lol_match_views.py fonctions/match/records_ui.py fonctions/match/records_preferences.py fonctions/match/match_views.py fonctions/match/recap_details.py fonctions/match/save_data.py
      - name: Test all offline scenarios and Discord size limits
        run: python -m pytest -q tests/test_match_records_ui.py tests/test_match_records_interactions.py tests/test_match_records_database.py
