name: Tests challenges et récaps MatchLoL

on:
  push:
    paths:
      - 'fonctions/challenge_*.py'
      - 'fonctions/gestion_challenge.py'
      - 'cogs/challenges.py'
      - 'cogs/leagueoflegends.py'
      - 'cogs/lol_account.py'
      - 'tests/test_challenges*.py'
      - '.github/workflows/test-challenges.yml'
  pull_request:
    paths:
      - 'fonctions/challenge_*.py'
      - 'fonctions/gestion_challenge.py'
      - 'cogs/challenges.py'
      - 'cogs/leagueoflegends.py'
      - 'cogs/lol_account.py'
      - 'tests/test_challenges*.py'
      - '.github/workflows/test-challenges.yml'

jobs:
  challenges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: challenges_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHALLENGES_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/challenges_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pandas Pillow matplotlib SQLAlchemy==2.0.4 psycopg2-binary discord-py-interactions==5.13.2 aiohttp
      - run: python -m py_compile cogs/challenges.py cogs/leagueoflegends.py cogs/lol_account.py cogs/lol_scoring.py fonctions/gestion_challenge.py fonctions/challenge_progress.py fonctions/challenge_store.py fonctions/challenge_ui.py
      - run: python -m pytest -q tests/test_challenges.py tests/test_challenges_postgres.py tests/test_match_records_ui.py tests/test_match_records_interactions.py
