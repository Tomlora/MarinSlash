name: Tests radar LoL
on:
  push:
    paths: ['fonctions/lol_radar.py', 'fonctions/match/recap_details.py', 'cogs/lol_radar.py', 'tests/test_lol_radar.py', '.github/workflows/test-lol-radar.yml']
  pull_request:
    paths: ['fonctions/lol_radar.py', 'fonctions/match/recap_details.py', 'cogs/lol_radar.py', 'tests/test_lol_radar.py', '.github/workflows/test-lol-radar.yml']
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_TEST_DSN: postgresql://postgres:test@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pandas Pillow discord-py-interactions==5.13.2 'psycopg[binary]'
      - run: python -m pytest -q tests/test_lol_radar.py
