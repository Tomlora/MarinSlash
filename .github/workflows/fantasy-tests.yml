name: Fantasy tests
on:
  pull_request:
    paths: ['fonctions/fantasy/**', 'cogs/fantasy*.py', 'tests/test_fantasy*', 'sql/migrations/*fantasy*', '.github/workflows/fantasy-tests.yml']
  push:
    branches: [fantasyleague, 'feat/fantasy-*']
    paths: ['fonctions/fantasy/**', 'cogs/fantasy*.py', 'tests/test_fantasy*', 'sql/migrations/*fantasy*', '.github/workflows/fantasy-tests.yml']
permissions:
  contents: read
jobs:
  fantasy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marin_fantasy_test
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      FANTASY_TEST_DSN: postgresql+psycopg2://fantasy:fantasy_test_only@localhost:5432/marin_fantasy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install SQLAlchemy==2.0.4 discord-py-interactions==5.13.2 psycopg2-binary tzdata
      - run: python -m unittest discover -s tests -p 'test_fantasy*.py' -v
